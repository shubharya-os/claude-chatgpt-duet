<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-label="A duet session: Claude Code and ChatGPT taking turns until both sign off">
  <rect width="760" height="600" rx="10" fill="#0d1117"/>
  <rect width="760" height="30" rx="10" fill="#161b22"/>
  <rect y="20" width="760" height="10" fill="#161b22"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="15" r="5" fill="#27c93f"/>
  <text x="380" y="19" fill="#6e7681" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">duet</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
    <text x="22" y="46" fill="#6e7681">$ duet run "add a duet verify subcommand" --gate "pytest -q"</text>
    <text x="22" y="84" fill="#6e7681">  claude   Claude Code        signed in (claude.ai)</text>
    <text x="22" y="103" fill="#6e7681">  chatgpt  ChatGPT (Codex)    Logged in using ChatGPT</text>
    <text x="22" y="141" fill="#6e7681">round 1  claude (lead)</text>
    <text x="22" y="160" fill="#3fb950" font-weight="600">    gate passed</text>
    <text x="22" y="179" fill="#39c5cf" font-weight="600">  claude   CONTINUE</text>
    <text x="22" y="198" fill="#8b949e">    Implemented duet verify, added 11 tests, turned the README</text>
    <text x="22" y="217" fill="#8b949e">    command block into a table.</text>
    <text x="22" y="255" fill="#6e7681">round 2  chatgpt (reviewer)</text>
    <text x="22" y="274" fill="#d2a8ff" font-weight="600">  chatgpt  DONE</text>
    <text x="22" y="293" fill="#8b949e">    Ran the gate myself: 87 passed. Checked --help and the empty</text>
    <text x="22" y="312" fill="#8b949e">    workspace path. I would ship this.</text>
    <text x="22" y="350" fill="#6e7681">round 3  claude (lead)</text>
    <text x="22" y="369" fill="#3fb950" font-weight="600">    gate passed</text>
    <text x="22" y="388" fill="#39c5cf" font-weight="600">  claude   DONE</text>
    <text x="22" y="407" fill="#8b949e">    Final check found a sentence of mine that was not true: verify</text>
    <text x="22" y="426" fill="#8b949e">    exits 0 on a gateless session, having run nothing. Fixed the</text>
    <text x="22" y="445" fill="#8b949e">    docs. My edit moved the digest, so you need to re-sign.</text>
    <text x="22" y="483" fill="#6e7681">round 4  chatgpt (reviewer)</text>
    <text x="22" y="502" fill="#d2a8ff" font-weight="600">  chatgpt  DONE</text>
    <text x="22" y="521" fill="#8b949e">    Re-reviewed the new state. Caveat matches behaviour. 87 passed.</text>
    <text x="22" y="559" fill="#3fb950" font-weight="600">  BOTH AGENTS SIGNED OFF   on workspace d35aa23b</text>
  </g>
</svg>
