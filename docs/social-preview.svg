<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 1280 1280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="1280" fill="#0d1117"/>
  <rect x="0" y="320" width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="320" width="1280" height="6" fill="#39c5cf"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="90" y="490" font-size="66" font-weight="700" fill="#c9d1d9">duet</text>
    <text x="90" y="570" font-size="36" fill="#c9d1d9">Stop copy-pasting between</text>
    <text x="90" y="620" font-size="36" fill="#c9d1d9">ChatGPT and Claude Code.</text>

    <text x="90" y="712" font-size="23" fill="#8b949e">They work the same task in your repo, argue,</text>
    <text x="90" y="748" font-size="23" fill="#8b949e">and neither one can call it done alone.</text>

    <g font-size="22">
      <rect x="90" y="796" width="300" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="112" y="826" fill="#39c5cf" font-weight="600">/duet</text>
      <text x="186" y="826" fill="#6e7681">in your editor</text>

      <rect x="408" y="796" width="190" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="430" y="826" fill="#3fb950" font-weight="600">no API keys</text>

      <rect x="616" y="796" width="272" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="638" y="826" fill="#d2a8ff" font-weight="600">both must sign off</text>
    </g>

    <text x="90" y="906" font-size="19" fill="#6e7681">github.com/shubharya-os/claude-chatgpt-duet</text>
  </g>

  <g transform="translate(940,500)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
    <rect x="-20" y="-40" width="280" height="250" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="0" y="0" fill="#6e7681">round 3</text>
    <text x="0" y="34" fill="#39c5cf" font-weight="600">claude   DONE</text>
    <text x="0" y="68" fill="#6e7681">round 4</text>
    <text x="0" y="102" fill="#d2a8ff" font-weight="600">chatgpt  DONE</text>
    <text x="0" y="152" fill="#3fb950" font-weight="600">BOTH SIGNED OFF</text>
    <text x="0" y="182" fill="#6e7681">state d35aa23b</text>
  </g>
</svg>
