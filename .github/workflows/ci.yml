name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - name: tests
        run: pytest -q
      - name: the loop runs end to end
        run: duet demo --quiet
      - name: doctor reports honestly with nothing connected
        run: duet doctor || test $? -eq 1
